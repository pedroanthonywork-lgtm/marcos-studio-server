<!doctype html>
<!-- Vídeo de moto Marcos Motos (sem IA). video.py copia este arquivo para a pasta do job como index.html,
     troca __DUR__/__VDUR__ e escreve vars.js (window.V). Estilos: pista | garagem | vitrine. Campo vazio = não aparece. -->
<html lang="pt-BR"><head><meta charset="UTF-8"/><title>Marcos Motos video</title>
<style>
@font-face{font-family:"M";src:url("assets/Montserrat.ttf");font-weight:100 900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
#root{position:absolute;inset:0;overflow:hidden;font-family:"M",sans-serif;color:#fff}
#vwrap{position:absolute;inset:0;transform-origin:50% 50%}
#bv{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.layer{position:absolute;inset:0;pointer-events:none}
.o{opacity:0}
#shadeB{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,0));opacity:0}
#flash{background:#fff;opacity:0}
#wm{position:absolute;right:40px;top:120px;width:250px;opacity:0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.gl{position:absolute;left:-40px;width:1160px;opacity:0;mix-blend-mode:screen}
/* ronco */
#som{position:absolute;left:50%;top:300px;transform:translateX(-50%);white-space:nowrap;padding:16px 34px;border-radius:60px;background:rgba(0,0,0,.6);border:3px solid #E31B23;font-weight:800;font-size:42px;letter-spacing:3px;opacity:0}
/* título */
#tt{position:absolute;left:0;right:0;top:1260px;text-align:center}
#ttM{display:flex;justify-content:center;flex-wrap:wrap;gap:0 4px;padding:0 40px;font-weight:900;font-size:132px;line-height:1.02;letter-spacing:-2px;text-shadow:0 10px 40px rgba(0,0,0,.65);transform:skewX(-8deg)}
#ttM span{display:inline-block;opacity:0;white-space:pre}
#ttA{display:inline-block;margin-top:22px;padding:12px 38px;border-radius:60px;background:#E31B23;font-weight:800;font-size:54px;letter-spacing:3px;opacity:0;box-shadow:0 12px 30px rgba(0,0,0,.4)}
/* preço */
#pz{position:absolute;left:0;right:0;top:1330px;text-align:center}
#pzS{display:inline-block;padding:10px 30px;background:#fff;color:#E31B23;font-weight:900;font-size:40px;letter-spacing:6px;opacity:0}
#pzP{display:block;width:max-content;margin:14px auto 0;padding:14px 46px;background:#E31B23;font-weight:900;font-size:118px;letter-spacing:-1px;transform:skewX(-8deg);opacity:0;box-shadow:0 18px 40px rgba(0,0,0,.5)}
/* extras */
.ex{position:absolute;left:50%;top:1480px;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:18px;padding:18px 36px;border-radius:22px;background:#fff;color:#0B0B0D;font-weight:800;font-size:56px;opacity:0;box-shadow:0 14px 34px rgba(0,0,0,.45);border-left:14px solid #E31B23}
.ex i{display:inline-block;width:42px;height:42px;border-radius:10px;background:#E31B23;position:relative;flex:0 0 auto}
.ex i:after{content:"";position:absolute;left:13px;top:6px;width:11px;height:20px;border:solid #fff;border-width:0 6px 6px 0;transform:rotate(45deg)}
/* serviços */
#sv{position:absolute;left:0;right:0;top:1380px;text-align:center}
#svA{display:inline-block;white-space:nowrap;background:#E31B23;padding:20px 36px;font-weight:900;font-size:50px;letter-spacing:1px;transform-origin:0 50%;opacity:0;box-shadow:0 16px 40px rgba(0,0,0,.45)}
#svB{display:inline-block;margin-top:16px;background:#fff;color:#0B0B0D;padding:12px 32px;font-weight:800;font-size:42px;letter-spacing:5px;opacity:0}
/* garagem: faixa de madeira com logo */
#wood{position:absolute;left:0;right:0;top:0;height:250px;opacity:0;
  background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.4)),repeating-linear-gradient(90deg,#C99D6E 0 13px,#7A5536 13px 17px,#B88A5C 17px 30px,#634329 30px 34px)}
#wood:after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:#E31B23}
#wood img{position:absolute;left:50%;top:58%;height:160px;transform:translate(-50%,-50%)}
/* garagem: lower third e checklist */
#lt{position:absolute;left:60px;top:1420px;padding:24px 40px 24px 34px;background:#fff;color:#0B0B0D;border-left:16px solid #E31B23;border-radius:0 24px 24px 0;opacity:0;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#ltM{font-weight:900;font-size:76px;line-height:1}
#ltA{margin-top:8px;font-weight:800;font-size:40px;color:#E31B23;letter-spacing:3px}
#card{position:absolute;left:90px;top:1080px;width:900px;padding:36px 36px 30px;border-radius:40px;opacity:0;background:rgba(11,11,13,.9);border:2px solid rgba(255,255,255,.2);box-shadow:0 40px 90px rgba(0,0,0,.55)}
#cardH{display:flex;align-items:center;gap:18px;font-weight:800;font-size:44px;padding:0 6px 20px}
#cardH i{display:inline-block;width:16px;height:44px;background:#E31B23;border-radius:5px}
.it{display:flex;align-items:center;gap:22px;padding:14px 20px;margin-top:12px;border-radius:22px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);opacity:0}
.ck{position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:50%;border:4px solid rgba(255,255,255,.35)}
.ckf{position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#ffd6d6,#E31B23 60%,#9b0f16);opacity:0}
.ck svg{position:absolute;inset:-4px;width:58px;height:58px}
.tx{font-weight:700;font-size:42px;opacity:.5}
/* vitrine: texto com linha */
#vt{position:absolute;left:70px;right:70px;top:1440px}
#vtL{height:8px;width:180px;background:#E31B23;transform-origin:0 50%;transform:scaleX(0)}
#vtM{margin-top:18px;font-weight:900;font-size:92px;line-height:1;opacity:0;text-shadow:0 8px 30px rgba(0,0,0,.6)}
#vtA{margin-top:10px;font-weight:600;font-size:46px;letter-spacing:8px;opacity:0;text-shadow:0 6px 20px rgba(0,0,0,.6)}
#vg{position:absolute;left:50%;top:1360px;transform:translateX(-50%);padding:26px 54px;border-radius:36px;background:rgba(255,255,255,.16);backdrop-filter:blur(18px);border:2px solid rgba(255,255,255,.4);text-align:center;opacity:0;white-space:nowrap}
#vgS{font-weight:800;font-size:36px;letter-spacing:6px;color:#FFB4B4}
#vgP{font-weight:900;font-size:104px;line-height:1.05}
/* cartão final */
#end{position:absolute;inset:0;opacity:0;overflow:hidden;background:#0B0B0D}
.stripe{position:absolute;width:2600px;height:220px;left:-760px;transform:rotate(-12deg)}
#stA{background:#E31B23;top:1430px}#stB{background:#fff;top:1690px;height:70px}
#endWood{position:absolute;inset:0;display:none;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#C99D6E 0 13px,#7A5536 13px 17px,#B88A5C 17px 30px,#634329 30px 34px)}
#logo{position:absolute;left:90px;top:420px;width:900px;opacity:0}
#cta{position:absolute;left:0;right:0;top:960px;text-align:center}
#ctaA{display:inline-block;background:#E31B23;color:#fff;padding:22px 46px;border-radius:70px;font-weight:900;font-size:58px;letter-spacing:1px;opacity:0}
#ctaB{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:30px;font-weight:900;font-size:86px;opacity:0}
#ctaB svg{width:84px;height:84px}
#ctaC{display:block;margin-top:22px;font-weight:700;font-size:40px;letter-spacing:2px;opacity:0}
#wipe{position:absolute;top:-400px;left:-1200px;width:900px;height:2800px;transform:rotate(14deg);background:#E31B23}
.vitrine #end{background:#fff;color:#0B0B0D}.vitrine #stB{background:#0B0B0D}.vitrine #ctaB,.vitrine #ctaC{color:#0B0B0D}
.garagem #endWood{display:block}.garagem #stA,.garagem #stB{display:none}
</style>
<script src="assets/gsap.min.js"></script>
<script src="vars.js"></script>
</head><body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="__DUR__">
  <div id="vwrap"><video id="bv" src="assets/base.mp4" data-start="0" data-duration="__VDUR__" data-track-index="0" muted playsinline></video></div>
  <div class="layer"><div id="shadeB"></div></div>
  <div class="layer"><div id="wood"><img src="assets/logo-claro.png"/></div><img id="wm" src="assets/logo-claro.png"/></div>
  <div class="layer"><div id="som">🔊 AUMENTA O SOM</div></div>
  <div class="layer"><div id="tt"><div id="ttM"></div><div id="ttA"></div></div></div>
  <div class="layer"><div id="lt"><div id="ltM"></div><div id="ltA"></div></div></div>
  <div class="layer"><div id="vt"><div id="vtL"></div><div id="vtM"></div><div id="vtA"></div></div></div>
  <div class="layer"><div id="pz"><div id="pzS"></div><div id="pzP"></div></div></div>
  <div class="layer"><div id="vg"><div id="vgS"></div><div id="vgP"></div></div></div>
  <div class="layer" id="exs"></div>
  <div class="layer"><div id="card"><div id="cardH"><i></i><span id="cardT"></span></div><div id="list"></div></div></div>
  <div class="layer"><div id="sv"><div id="svA">FINANCIAMOS · ACEITAMOS TROCA</div><br/><div id="svB">MARCOS MOTOS</div></div></div>
  <div class="layer" id="glitch">
    <div class="gl" id="g1" style="top:420px;height:120px;background:rgba(255,0,40,.55)"></div>
    <div class="gl" id="g2" style="top:900px;height:70px;background:rgba(0,220,255,.5)"></div>
    <div class="gl" id="g3" style="top:1320px;height:160px;background:rgba(255,0,40,.45)"></div>
    <div class="gl" id="g4" style="top:1610px;height:60px;background:rgba(0,220,255,.5)"></div>
  </div>
  <div id="end">
    <div id="endWood"></div><div class="stripe" id="stA"></div><div class="stripe" id="stB"></div>
    <img id="logo" src="assets/logo-claro.png"/>
    <div id="cta"><div id="ctaA">CHAMA NO WHATSAPP</div>
      <div id="ctaB"><svg viewBox="0 0 24 24"><path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M8.6 7.2c.2-.4.4-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .6l-.4.6-.3.4c-.1.2-.2.3 0 .6.2.3.8 1.3 1.7 2 .9.8 1.7 1.1 2 1.2.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.8.9c.3.1.4.2.5.3 0 .2 0 .9-.3 1.5-.3.7-1.6 1.3-2.2 1.3-.6.1-1.1.3-3.8-.8-3.2-1.3-5.2-4.6-5.4-4.8-.2-.2-1.3-1.7-1.3-3.3 0-1.5.8-2.3 1.1-2.6z"/></svg><span id="wa"></span></div>
      <span id="ctaC">@marcos_motos.sg · São Gotardo</span></div>
  </div>
  <div class="layer"><div id="wipe" data-layout-allow-overflow data-layout-allow-occlusion></div></div>
  <div class="layer" id="flash"></div>
</div>
<script>
(function(){
  gsap.defaults({lazy:false});
  window.__timelines = window.__timelines || {};
  const V = window.V, tl = gsap.timeline({paused:true}), $ = id => document.getElementById(id), S = v => (v == null ? "" : String(v).trim());
  const ST = V.estilo, cuts = V.cuts, FIM = V.vdur, DUR = V.dur;
  document.getElementById("root").classList.add(ST);
  const at = k => cuts[Math.min(k, cuts.length - 1)].start;            // início do corte k
  const out = (sel, t) => tl.fromTo(sel, {opacity:1}, {opacity:0, duration:.14, immediateRender:false}, t - .14);
  const pop = (sel, t, from) => tl.fromTo(sel, Object.assign({opacity:0, scale:.5}, from || {}), {opacity:1, scale:1, y:0, x:0, duration:.3, ease:"back.out(2.4)"}, t);

  // ---------- transições: toda troca de corte tem efeito ----------
  function punch(t, s){ tl.fromTo("#vwrap",{scale:s||1.2,filter:"blur(10px)"},{scale:1,filter:"blur(0px)",duration:.3,ease:"power3.out",immediateRender:false},t); }
  function flash(t, k){ tl.fromTo("#flash",{opacity:0},{opacity:k||.9,duration:.05,ease:"none",immediateRender:false},t-.05); tl.fromTo("#flash",{opacity:k||.9},{opacity:0,duration:.28,ease:"power2.out",immediateRender:false},t); }
  function glitch(t){
    ["#g1","#g2","#g3","#g4"].forEach((g,i)=>{
      tl.fromTo(g,{opacity:0,x:0},{opacity:1,x:(i%2?60:-60),duration:.04,ease:"none",immediateRender:false},t-.08+i*.015);
      tl.fromTo(g,{opacity:1,x:(i%2?60:-60)},{opacity:0,x:(i%2?-30:30),duration:.12,ease:"none",immediateRender:false},t+.02+i*.015); });
    tl.fromTo("#vwrap",{x:0},{x:-28,duration:.04,ease:"none",immediateRender:false},t-.06);
    tl.fromTo("#vwrap",{x:-28},{x:22,duration:.05,ease:"none",immediateRender:false},t-.02);
    tl.fromTo("#vwrap",{x:22},{x:0,duration:.08,ease:"power2.out",immediateRender:false},t+.03);
  }
  function whip(t){ tl.fromTo("#vwrap",{x:260,scale:1.5,filter:"blur(14px)"},{x:0,scale:1,filter:"blur(0px)",duration:.26,ease:"power3.out",immediateRender:false},t); }
  function soft(t){ tl.fromTo("#vwrap",{scale:1.08},{scale:1,duration:.4,ease:"power2.out",immediateRender:false},t); flash(t,.55); }
  const TR = {pista:[punch, flash, punch, glitch], garagem:[glitch, whip, punch, glitch, flash], vitrine:[soft, whip, soft]}[ST];
  const kinds = [];
  cuts.slice(1).forEach((c,i)=>{ const f = TR[i % TR.length]; f(c.start); kinds.push(f.name); });
  V.transicoes = kinds;  // video.py lê isto via sfx.json gerado em Python (mesma regra)

  // ---------- logo no canto ----------
  if (ST !== "garagem") { pop("#wm", .35); out("#wm", FIM - .3); }
  else { tl.fromTo("#wood",{opacity:0,y:-250},{opacity:1,y:0,duration:.4,ease:"power3.out"},.1); out("#wood", FIM - .3); }

  // ---------- abertura: ronco ----------
  let t0 = .15;
  if (V.ronco) { pop("#som", .1, {y:-30}); out("#som", at(1)); t0 = at(1) + .12; }

  const modelo = S(V.modelo), ano = S(V.ano), selo = S(V.selo), preco = S(V.preco), extras = (V.extras || []).map(S).filter(Boolean);
  const kTitle = V.ronco ? 1 : 0, nC = cuts.length;
  // corte do preço ~45%, extras nos seguintes, serviços no último corte
  const kPrice = Math.max(kTitle + 2, Math.round(nC * .45)), kSv = nC - 1;
  const titleEnd = at(kTitle + 2);

  // ---------- título ----------
  tl.fromTo("#shadeB",{opacity:0},{opacity:1,duration:.3},Math.max(0,t0-.15));
  if (ST === "pista" && modelo) {
    modelo.split("").forEach((ch,i)=>{ const s=document.createElement("span"); s.id="h"+i; s.textContent=ch; $("ttM").appendChild(s);
      tl.fromTo("#h"+i,{opacity:0,y:120,scale:.6},{opacity:1,y:0,scale:1,duration:.34,ease:"back.out(2.2)"},t0+i*Math.min(.05, .6/modelo.length)); });
    if (ano) { $("ttA").textContent = ano; pop("#ttA", t0 + .45); }
    tl.fromTo("#tt",{opacity:1,x:0},{opacity:0,x:-200,duration:.18,ease:"power2.in",immediateRender:false},titleEnd-.18);
  }
  if (ST === "garagem" && (modelo || ano)) {
    $("ltM").textContent = modelo; $("ltA").textContent = ano; if (!modelo) $("ltM").style.display="none"; if (!ano) $("ltA").style.display="none";
    tl.fromTo("#lt",{opacity:0,x:-700},{opacity:1,x:0,duration:.4,ease:"power3.out"},t0);
    tl.fromTo("#lt",{opacity:1,x:0},{opacity:0,x:-700,duration:.2,ease:"power2.in",immediateRender:false},titleEnd-.2);
  }
  if (ST === "vitrine" && (modelo || ano)) {
    $("vtM").textContent = modelo; $("vtA").textContent = ano.toUpperCase();
    tl.fromTo("#vtL",{scaleX:0},{scaleX:1,duration:.4,ease:"power3.out"},t0);
    tl.fromTo("#vtM",{opacity:0,x:-80},{opacity:1,x:0,duration:.45,ease:"power3.out"},t0+.15);
    tl.fromTo("#vtA",{opacity:0,x:-60},{opacity:1,x:0,duration:.45,ease:"power3.out"},t0+.3);
    tl.fromTo("#vt",{opacity:1},{opacity:0,duration:.25,immediateRender:false},titleEnd-.25);
  }

  // ---------- preço ----------
  let tP = at(kPrice) + .2, tPend = at(Math.min(kPrice + 2, kSv));
  if (selo || preco) {
    if (ST === "vitrine") {
      $("vgS").textContent = selo.toUpperCase(); $("vgP").textContent = preco; if (!selo) $("vgS").style.display="none"; if (!preco) $("vgP").style.display="none";
      tl.fromTo("#vg",{opacity:0,y:80},{opacity:1,y:0,duration:.45,ease:"power3.out"},tP);
      out("#vg", tPend);
    } else {
      $("pzS").textContent = selo.toUpperCase(); $("pzP").textContent = preco; if (!selo) $("pzS").style.display="none"; if (!preco) $("pzP").style.display="none";
      if (selo) pop("#pzS", tP, {y:-30});
      if (preco) tl.fromTo("#pzP",{opacity:0,scale:1.6},{opacity:1,scale:1,duration:.28,ease:"power4.out"},tP+.18);
      out("#pz", tPend);
    }
  } else tPend = tP;

  // ---------- extras ----------
  if (extras.length) {
    if (ST === "garagem") {
      $("cardT").textContent = modelo || "DESTAQUES";
      const c0 = tPend + .1, cEnd = at(kSv);
      extras.forEach((s,q)=>{ const d=document.createElement("div"); d.className="it"; d.id="it"+q;
        d.innerHTML='<div class="ck"><i class="ckf" id="cf'+q+'"></i><svg viewBox="0 0 58 58"><path id="cp'+q+'" d="M16 30 L25 39 L43 20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="44" stroke-dashoffset="44"/></svg></div><div class="tx" id="tx'+q+'"></div>';
        $("list").appendChild(d); $("tx"+q).textContent = s; });
      tl.fromTo("#card",{opacity:0,y:240,scale:.92},{opacity:1,y:0,scale:1,duration:.4,ease:"power3.out"},c0);
      extras.forEach((s,q)=>{ tl.fromTo("#it"+q,{opacity:0,x:60},{opacity:1,x:0,duration:.22,ease:"power3.out"},c0+.15+q*.05);
        const tq = c0 + .45 + q * .26; V.ticks = (V.ticks||[]).concat(tq);
        tl.fromTo("#cf"+q,{opacity:0},{opacity:1,duration:.08},tq);
        tl.fromTo("#cp"+q,{strokeDashoffset:44},{strokeDashoffset:0,duration:.18,ease:"power2.out"},tq+.03);
        tl.fromTo("#tx"+q,{opacity:.5},{opacity:1,duration:.12,immediateRender:false},tq); });
      out("#card", cEnd);
    } else {
      const span = (at(kSv) - tPend) / extras.length;
      extras.forEach((s,q)=>{ const d=document.createElement("div"); d.className="ex"; d.id="ex"+q; d.innerHTML="<i></i><span></span>"; d.querySelector("span").textContent = s; $("exs").appendChild(d);
        const t = tPend + .1 + q * span; pop("#ex"+q, t, {y:40}); out("#ex"+q, t + Math.max(.7, span - .05)); });
    }
  }

  // ---------- serviços (letreiro: compra, venda, troca, financia) ----------
  tl.fromTo("#svA",{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:.35,ease:"power4.out"},at(kSv)+.15);
  tl.fromTo("#svB",{opacity:0,y:30},{opacity:1,y:0,duration:.3,ease:"power3.out"},at(kSv)+.4);
  out(["#svA","#svB"], FIM);
  tl.fromTo("#shadeB",{opacity:1},{opacity:0,duration:.2,immediateRender:false},FIM-.1);

  // ---------- cartão final ----------
  const f = FIM;
  $("wa").textContent = V.whatsapp;
  if (ST === "vitrine") $("logo").src = "assets/logo-escuro.png";
  tl.fromTo("#wipe",{x:0},{x:2600,duration:.55,ease:"power3.inOut"},f-.3);
  tl.fromTo("#end",{opacity:0},{opacity:1,duration:.01},f);
  tl.fromTo("#stA",{x:-1600},{x:0,duration:.5,ease:"power3.out"},f+.12);
  tl.fromTo("#stB",{x:1600},{x:0,duration:.5,ease:"power3.out"},f+.22);
  tl.set("#logo",{transformOrigin:"50% 50%"},f+.25);
  tl.fromTo("#logo",{opacity:0,scale:.5,rotation:-4},{opacity:1,scale:1,rotation:0,duration:.5,ease:"back.out(1.8)"},f+.25);
  tl.fromTo("#ctaA",{opacity:0,y:60},{opacity:1,y:0,duration:.35,ease:"back.out(2)"},f+.75);
  tl.fromTo("#ctaB",{opacity:0,scale:.6},{opacity:1,scale:1,duration:.35,ease:"back.out(2)"},f+1.0);
  tl.fromTo("#ctaC",{opacity:0},{opacity:1,duration:.3},f+1.3);
  tl.fromTo("#logo",{scale:1},{scale:1.04,duration:1.2,ease:"sine.inOut",immediateRender:false},f+1.4);
  tl.to({}, {duration:DUR}, 0);
  window.__timelines["main"] = tl;
})();
</script>
</body></html>
